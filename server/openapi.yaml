openapi: 3.1.0
info:
  title: MovieShelf API
  version: 0.1.0
  description: |
    Backend for the MovieShelf frontend. Contract-first: agree on shapes here before writing routes.

    Conventions:
    - All app routes live under `/api`. In dev, Vite proxies `/api` to the server.
    - Errors always use the `Error` schema below.
    - Every response carries an `x-request-id` header. Send your own (1–64 chars of `A-Za-z0-9._-`) to correlate logs; otherwise the server generates a UUID.
    - Timestamps are ISO 8601 strings; the frontend formats "2 days ago" itself.
servers:
  - url: /
paths:
  /api/health:
    get:
      summary: Liveness check (also served at `/health`)
      operationId: getHealth
      responses:
        "200":
          description: Server is up
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
        default:
          $ref: "#/components/responses/Error"

  /api/movies:
    get:
      summary: Browse movies (the Browse Movies page filters)
      operationId: listMovies
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: genre, in: query, schema: { type: string, maxLength: 100 } }
        - { name: language, in: query, description: "Language code, e.g. EN", schema: { type: string, maxLength: 100 } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: minRating, in: query, schema: { type: number, minimum: 0, maximum: 10 } }
        - name: sort
          in: query
          description: "popularity = trending order; date = newest release first; rating = highest first"
          schema: { type: string, enum: [popularity, date, rating, az], default: popularity }
      responses:
        "200":
          description: A page of movies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Movie" } }
        "400": { $ref: "#/components/responses/Error" }

  /api/movies/{id}:
    get:
      summary: One movie
      operationId: getMovie
      parameters:
        - $ref: "#/components/parameters/MovieId"
      responses:
        "200":
          description: Movie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Movie" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/movies/{id}/providers:
    get:
      summary: Where to Watch for one movie in one region
      description: |
        Region: `?region=` if given, else the device's saved region, else the CDN's country header
        (cf-ipcountry, x-vercel-ip-country, cloudfront-viewer-country), else PH. Empty when no provider is listed.
      operationId: getMovieProviders
      parameters:
        - $ref: "#/components/parameters/MovieId"
        - { name: region, in: query, schema: { type: string, pattern: "^[A-Z]{2}$", examples: [PH] } }
      responses:
        "200":
          description: Providers in display order
          content:
            application/json:
              schema:
                type: object
                required: [region, regionSource, source, attribution, items]
                properties:
                  region: { type: string }
                  regionSource: { $ref: "#/components/schemas/RegionSource" }
                  source:
                    type: string
                    enum: [tmdb, catalog]
                    description: "tmdb = live JustWatch data via TMDB (needs TMDB_API_KEY, cached 24 h); catalog = MovieShelf's own list"
                  attribution:
                    type: [string, "null"]
                    description: "Must be shown with TMDB data (TMDB and JustWatch terms)"
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, type, url]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        type: { type: string, enum: [Subscription, Free, Rent, Buy] }
                        price: { type: [string, "null"], examples: ["₱149"] }
                        quality: { type: [string, "null"], examples: [4K HDR] }
                        url: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/movies/{id}/subtitles:
    get:
      summary: Subtitle tracks for a movie (metadata only; fetch cues from /api/subtitles/{trackId})
      operationId: listSubtitleTracks
      parameters:
        - $ref: "#/components/parameters/MovieId"
        - { name: lang, in: query, schema: { type: string, pattern: "^[a-z]{2,3}$", examples: [tl] } }
      responses:
        "200":
          description: Tracks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, movieId, language, langCode, releaseName, format, hearingImpaired]
                      properties:
                        id: { type: string, examples: [sub-en-horizon-web] }
                        movieId: { type: string }
                        language: { type: string, examples: [Filipino / Tagalog] }
                        langCode: { type: string, examples: [tl] }
                        releaseName: { type: string }
                        format: { type: string, enum: [SRT, WebVTT], description: "Format as uploaded; always served as WebVTT" }
                        fps: { type: [string, "null"], examples: ["23.976"] }
                        hearingImpaired: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/subtitles/{trackId}:
    get:
      summary: A subtitle track as WebVTT (SRT is converted on the server)
      operationId: getSubtitleTrack
      parameters:
        - { name: trackId, in: path, required: true, schema: { type: string, pattern: "^sub-[a-z0-9-]{1,128}$" } }
      responses:
        "200":
          description: WebVTT file
          content:
            text/vtt:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }

  /api/me/region:
    get:
      summary: This device's region for Where to Watch, and where it came from
      operationId: getRegion
      security: [{ device: [] }, {}]
      responses:
        "200": { $ref: "#/components/responses/Region" }
    put:
      summary: Save this device's region
      operationId: setRegion
      security: [{ device: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [region]
              properties:
                region: { type: string, pattern: "^[A-Z]{2}$", description: "Must be one of /api/meta/regions" }
      responses:
        "200": { $ref: "#/components/responses/Region" }
        "400": { $ref: "#/components/responses/Error" }

  /api/series:
    get:
      summary: Browse series (the Browse Manga page filters)
      operationId: listSeries
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: type, in: query, schema: { type: string, examples: [Manhwa, Manga] } }
        - { name: status, in: query, schema: { type: string, examples: [Ongoing, Completed, Hiatus] } }
        - { name: genre, in: query, schema: { type: string, maxLength: 100 } }
        - { name: year, in: query, schema: { type: integer } }
        - name: sort
          in: query
          description: "popularity = highest rating first; latest = most recent chapter release first; chapters = most chapters first"
          schema: { type: string, enum: [popularity, latest, az, chapters], default: popularity }
      responses:
        "200":
          description: A page of series
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Series" } }
        "400": { $ref: "#/components/responses/Error" }

  /api/series/{id}:
    get:
      summary: One series (without its chapter list)
      operationId: getSeries
      parameters:
        - $ref: "#/components/parameters/SeriesId"
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/series/{id}/chapters:
    get:
      summary: Chapters of a series, ascending by number
      operationId: listChapters
      parameters:
        - $ref: "#/components/parameters/SeriesId"
        - $ref: "#/components/parameters/Page"
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: A page of chapters
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/Chapter" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/chapters/{id}/pages:
    get:
      summary: Page manifest for a chapter
      operationId: getChapterPages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^ch-[a-z0-9-]{1,128}$" }
      responses:
        "200":
          description: Pages in reading order
          content:
            application/json:
              schema:
                type: object
                required: [chapterId, seriesId, pages]
                properties:
                  chapterId: { type: string }
                  seriesId: { type: string }
                  pages: { type: array, items: { $ref: "#/components/schemas/Page" } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/search:
    get:
      summary: Search movies and series
      description: |
        Matches title, original and alternate titles, director, cast, author, artist and genres.
        A substring, a whole word, or a close spelling matches ("horizn" finds "Last Horizon").
      operationId: search
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: scope
          in: query
          schema: { type: string, enum: [all, movies, series, manga, manhwa], default: all }
        - { name: genre, in: query, schema: { type: string, maxLength: 100 } }
        - name: sort
          in: query
          description: "relevance = best match first, then trending order"
          schema: { type: string, enum: [relevance, rating, year, az], default: relevance }
      responses:
        "200":
          description: A page of mixed results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    required: [items]
                    properties:
                      items: { type: array, items: { $ref: "#/components/schemas/SearchHit" } }
        "400": { $ref: "#/components/responses/Error" }

  /api/search/suggest:
    get:
      summary: Top matches for the Quick Search box (up to 4 movies and 4 series)
      operationId: suggest
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                required: [movies, series]
                properties:
                  movies: { type: array, maxItems: 4, items: { $ref: "#/components/schemas/Movie" } }
                  series: { type: array, maxItems: 4, items: { $ref: "#/components/schemas/Series" } }
        "400": { $ref: "#/components/responses/Error" }

  /api/meta/genres:
    get:
      summary: Genre names for movies or series
      operationId: listGenres
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [movie, series] }
      responses:
        "200":
          description: Genre names
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }

  /api/meta/languages:
    get:
      summary: Movie languages
      operationId: listLanguages
      responses:
        "200":
          description: Languages
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [code, label]
                      properties:
                        code: { type: string, examples: [TL] }
                        label: { type: string, examples: [Filipino / Tagalog] }

  /api/meta/regions:
    get:
      summary: Regions for Where to Watch
      operationId: listRegions
      responses:
        "200":
          description: Regions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [code, name]
                      properties:
                        code: { type: string, examples: [PH] }
                        name: { type: string, examples: [Philippines] }

  /api/home:
    get:
      summary: Home page rails
      description: Rails come from the curation table (featured_slots). `manhwa` and `manga` are `trendingSeries` filtered by type.
      operationId: getHome
      responses:
        "200":
          description: Rails
          content:
            application/json:
              schema:
                type: object
                required: [hero, trending, recentReleases, regionalPicks, trendingSeries, manhwa, manga]
                properties:
                  hero: { type: array, items: { $ref: "#/components/schemas/CuratedMovie" } }
                  trending: { type: array, items: { $ref: "#/components/schemas/CuratedMovie" } }
                  recentReleases: { type: array, items: { $ref: "#/components/schemas/CuratedMovie" } }
                  regionalPicks: { type: array, items: { $ref: "#/components/schemas/CuratedMovie" } }
                  trendingSeries: { type: array, items: { $ref: "#/components/schemas/CuratedSeries" } }
                  manhwa: { type: array, items: { $ref: "#/components/schemas/CuratedSeries" } }
                  manga: { type: array, items: { $ref: "#/components/schemas/CuratedSeries" } }

  # ---- Library and progress (Phase 3). All scoped to the device cookie. ----

  /api/library:
    get:
      summary: My List for this device, newest first
      description: Empty (and no cookie is set) when the browser has no device yet.
      operationId: listLibrary
      security: [{ device: [] }, {}]
      responses:
        "200":
          description: Library items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/LibraryItem" } }
    post:
      summary: Add a title to My List
      description: |
        The status is picked from history: movies Watched / Watching / Plan to Watch, series Completed / Reading / Plan to Read.
        Adding a title that is already listed returns the existing item with 200, so offline queues can replay it.
        Creates the device and sets its cookie on first use.
      operationId: addToLibrary
      security: [{ device: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaType, mediaId]
              properties:
                mediaType: { type: string, enum: [movie, series] }
                mediaId: { type: string, examples: [mov-last-horizon] }
                updatedAt: { $ref: "#/components/schemas/ClientTime" }
      responses:
        "201": { $ref: "#/components/responses/LibraryItem" }
        "200": { $ref: "#/components/responses/LibraryItem" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/library/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Change a library item's status by hand
      operationId: setLibraryStatus
      security: [{ device: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, description: "Must be valid for the item's media type" }
                updatedAt: { $ref: "#/components/schemas/ClientTime" }
      responses:
        "200": { $ref: "#/components/responses/LibraryItem" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Stale" }
    delete:
      summary: Remove from My List
      operationId: removeFromLibrary
      security: [{ device: [] }]
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }

  /api/progress/movies:
    get:
      summary: Every movie this device has played, newest first
      description: Continue Watching is the items with `inContinueWatching`; watch history is the items with `watched`.
      operationId: listMovieProgress
      security: [{ device: [] }, {}]
      responses:
        "200":
          description: Movie progress
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MovieProgress" } }

  /api/progress/movies/{movieId}:
    parameters:
      - { name: movieId, in: path, required: true, schema: { type: string, pattern: "^mov-[a-z0-9-]{1,128}$" } }
    put:
      summary: Save playback position
      description: |
        Send one on play (positionSec 0) and then at most every 10 s. At ≥ 90 % the movie becomes Watched and leaves
        Continue Watching; below that, a listed movie becomes Watching (Watched stays Watched).
        A write within 10 s of the last one that changes no status gets 429 with Retry-After.
      operationId: saveMovieProgress
      security: [{ device: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positionSec, durationSec]
              properties:
                positionSec: { type: number, minimum: 0 }
                durationSec: { type: number, exclusiveMinimum: 0 }
                updatedAt: { $ref: "#/components/schemas/ClientTime" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [progress, libraryItem]
                properties:
                  progress: { $ref: "#/components/schemas/MovieProgress" }
                  libraryItem: { oneOf: [{ $ref: "#/components/schemas/LibraryItem" }, { type: "null" }] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Stale" }
        "429": { $ref: "#/components/responses/Throttled" }
    delete:
      summary: Remove from Continue Watching (history is kept)
      operationId: dismissMovieProgress
      security: [{ device: [] }]
      responses:
        "204": { description: Dismissed }
        "404": { $ref: "#/components/responses/Error" }

  /api/progress/series:
    get:
      summary: Where this device is in each series, newest first
      description: Continue Reading is the items with `inContinueReading`.
      operationId: listSeriesProgress
      security: [{ device: [] }, {}]
      responses:
        "200":
          description: Reading progress
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SeriesProgress" } }

  /api/progress/series/{seriesId}:
    parameters:
      - $ref: "#/components/parameters/SeriesIdPath"
    put:
      summary: Save reading position
      description: |
        Send one when a chapter opens and on page turns. The chapter becomes In progress (Read stays Read), or Read
        when pageIndex >= totalPages. When every chapter is Read the series becomes Completed and leaves Continue
        Reading; otherwise a listed series becomes Reading. Throttled like movie progress, except that opening a
        different chapter or changing any status is never throttled.
      operationId: saveSeriesProgress
      security: [{ device: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chapterId, pageIndex, totalPages, mode]
              properties:
                chapterId: { type: string, examples: [ch-pm-2] }
                pageIndex: { type: integer, minimum: 0 }
                totalPages: { type: integer, minimum: 1 }
                mode: { type: string, examples: [vertical, single] }
                updatedAt: { $ref: "#/components/schemas/ClientTime" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [progress, chapterStatus, libraryItem]
                properties:
                  progress: { $ref: "#/components/schemas/SeriesProgress" }
                  chapterStatus: { $ref: "#/components/schemas/ChapterStatusValue" }
                  libraryItem: { oneOf: [{ $ref: "#/components/schemas/LibraryItem" }, { type: "null" }] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Stale" }
        "429": { $ref: "#/components/responses/Throttled" }
    delete:
      summary: Remove from Continue Reading
      operationId: dismissSeriesProgress
      security: [{ device: [] }]
      responses:
        "204": { description: Dismissed }
        "404": { $ref: "#/components/responses/Error" }

  /api/progress/chapters:
    get:
      summary: Chapter statuses this device has set (missing chapters are Unread)
      operationId: listChapterStatuses
      security: [{ device: [] }, {}]
      parameters:
        - { name: seriesId, in: query, schema: { type: string, pattern: "^ser-[a-z0-9-]{1,128}$" } }
      responses:
        "200":
          description: Chapter statuses
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [chapterId, seriesId, status, updatedAt]
                      properties:
                        chapterId: { type: string }
                        seriesId: { type: string }
                        status: { $ref: "#/components/schemas/ChapterStatusValue" }
                        updatedAt: { type: string, format: date-time }

components:
  securitySchemes:
    device:
      type: apiKey
      in: cookie
      name: ms_device
      description: |
        Anonymous device ID. HttpOnly, SameSite=Lax, Path=/api, renewed on every write (400 days); Secure in
        production. The first write creates it. No sign-in exists.
  parameters:
    SeriesIdPath:
      name: seriesId
      in: path
      required: true
      schema: { type: string, pattern: "^ser-[a-z0-9-]{1,128}$" }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SearchQuery:
      name: q
      in: query
      required: true
      description: Trimmed; must contain a non-space character.
      schema: { type: string, maxLength: 100, pattern: '\S' }
    MovieId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^mov-[a-z0-9-]{1,128}$" }
    SeriesId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^ser-[a-z0-9-]{1,128}$" }
  headers:
    RequestId:
      description: Request ID for log correlation
      schema:
        type: string
  schemas:
    RegionSource:
      type: string
      enum: [query, saved, header, default]

    ClientTime:
      type: string
      format: date-time
      description: |
        When the change happened on the client (for offline sync). Defaults to now; capped at the server clock.
        A write older than the saved one is refused with 409 STALE_WRITE (last write wins).

    LibraryItem:
      type: object
      required: [id, mediaType, mediaId, status, addedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        mediaType: { type: string, enum: [movie, series] }
        mediaId: { type: string }
        status: { type: string, enum: [Plan to Watch, Watching, Watched, Plan to Read, Reading, Completed] }
        addedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MovieProgress:
      type: object
      required: [movieId, positionSec, durationSec, watched, watchedAt, inContinueWatching, updatedAt]
      properties:
        movieId: { type: string }
        positionSec: { type: number }
        durationSec: { type: number }
        watched: { type: boolean }
        watchedAt: { type: [string, "null"], format: date-time }
        inContinueWatching: { type: boolean }
        updatedAt: { type: string, format: date-time }

    SeriesProgress:
      type: object
      required: [seriesId, chapterId, chapterNumber, pageIndex, totalPages, mode, inContinueReading, updatedAt]
      properties:
        seriesId: { type: string }
        chapterId: { type: string }
        chapterNumber: { type: number }
        chapterTitle: { type: [string, "null"] }
        pageIndex: { type: integer }
        totalPages: { type: integer }
        mode: { type: string }
        inContinueReading: { type: boolean }
        updatedAt: { type: string, format: date-time }

    ChapterStatusValue:
      type: string
      enum: [Unread, In progress, Read]

    PageMeta:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer, description: Matching items across all pages }

    SearchHit:
      oneOf:
        - type: object
          required: [kind, item]
          properties:
            kind: { const: movie }
            item: { $ref: "#/components/schemas/Movie" }
        - type: object
          required: [kind, item]
          properties:
            kind: { const: series }
            item: { $ref: "#/components/schemas/Series" }

    Palette:
      description: Placeholder artwork colours until real posters exist.
      type: [object, "null"]
      additionalProperties: { type: string }

    Movie:
      type: object
      required: [id, title, genres, cast, updatedAt]
      properties:
        id: { type: string, examples: [mov-last-horizon] }
        tmdbId: { type: [integer, "null"] }
        imdbId: { type: [string, "null"] }
        title: { type: string }
        originalTitle: { type: [string, "null"] }
        year: { type: [integer, "null"] }
        releaseDate: { type: [string, "null"], format: date }
        runtimeMinutes: { type: [integer, "null"], description: Replaces the old `runtime` label. Format it on the client. }
        rating: { type: [number, "null"], examples: [8.9] }
        maturityRating: { type: [string, "null"], examples: [PG-13] }
        languageCode: { type: [string, "null"], examples: [EN] }
        originalLanguage: { type: [string, "null"], description: Label for languageCode }
        genres: { type: array, items: { type: string }, description: First entry is the primary genre }
        synopsis: { type: [string, "null"] }
        shortSynopsis: { type: [string, "null"] }
        director: { type: [string, "null"] }
        cast:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, examples: [per-julian-mercer] }
              name: { type: string }
              character: { type: [string, "null"] }
              role: { type: [string, "null"] }
        palette: { $ref: "#/components/schemas/Palette" }
        availability:
          description: |
            Computed from license data for the viewer's region (saved region, then CDN country, then PH).
            A region's own license beats the worldwide one; dates are inclusive, in UTC.
          type: object
          required: [canStream, canDownload, statusText]
          properties:
            canStream: { type: boolean }
            canDownload: { type: boolean }
            format: { type: [string, "null"], examples: [MP4, HLS Stream] }
            sizeBytes: { type: [integer, "null"], description: Replaces `sizeLabel`. Null for stream-only titles. }
            resolution: { type: [string, "null"] }
            statusText:
              type: string
              examples:
                - MP4 • Eligible for download
                - Authorized for streaming • Download unavailable for this license
                - Catalog listing • Streaming window opens Dec 1, 2026
                - Streaming Unavailable
                - Not available in your region
            availableUntil: { type: [string, "null"], format: date, description: "Last day of the license in force" }
            availableFrom: { type: [string, "null"], format: date, description: "First day of an upcoming license" }
        trailer:
          type: [object, "null"]
          properties:
            title: { type: string }
            duration: { type: string }
            aspect: { type: string }
            summary: { type: string }
            videoUrl: { type: [string, "null"], description: "Playable trailer (YouTube or MP4 URL). Null until real trailers exist." }
        updatedAt: { type: string, format: date-time }

    CuratedMovie:
      allOf:
        - $ref: "#/components/schemas/Movie"
        - type: object
          properties:
            kicker: { type: [string, "null"], description: Editorial label for this placement }

    Series:
      type: object
      required: [id, title, type, status, alternateTitles, genres, chapterCount, updatedAt]
      properties:
        id: { type: string, examples: [ser-paper-moon] }
        title: { type: string }
        alternateTitles: { type: array, items: { type: string } }
        type: { type: string, examples: [Manhwa, Manga] }
        status: { type: string, examples: [Ongoing, Completed, Hiatus] }
        year: { type: [integer, "null"] }
        rating: { type: [number, "null"] }
        author: { type: [string, "null"] }
        artist: { type: [string, "null"] }
        readingDirection: { type: [string, "null"], examples: [LTR, RTL] }
        readingFormat: { type: [string, "null"] }
        genres: { type: array, items: { type: string } }
        synopsis: { type: [string, "null"] }
        shortSynopsis: { type: [string, "null"] }
        palette: { $ref: "#/components/schemas/Palette" }
        chapterCount: { type: integer, description: Computed from the chapter list }
        latestChapter:
          description: Highest-numbered chapter. Its releaseDate replaces the old `updatedLabel`.
          type: [object, "null"]
          properties:
            id: { type: string }
            number: { type: number }
            title: { type: [string, "null"] }
            releaseDate: { type: [string, "null"], format: date }
        updatedAt: { type: string, format: date-time }

    CuratedSeries:
      allOf:
        - $ref: "#/components/schemas/Series"
        - type: object
          properties:
            kicker: { type: [string, "null"] }

    Chapter:
      type: object
      required: [id, seriesId, number, pageCount]
      properties:
        id: { type: string, examples: [ch-pm-2] }
        seriesId: { type: string }
        number: { type: number, description: May be fractional (10.5) }
        title: { type: [string, "null"] }
        releaseDate: { type: [string, "null"], format: date }
        palette: { $ref: "#/components/schemas/Palette" }
        pageCount: { type: integer }

    Page:
      type: object
      required: [pageNumber]
      properties:
        pageNumber: { type: integer }
        caption: { type: [string, "null"] }
        subCaption: { type: [string, "null"] }
        palette: { $ref: "#/components/schemas/Palette" }
        imageUrl: { type: [string, "null"], description: Null until hosted pages exist (BE-33) }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable code (e.g. NOT_FOUND, VALIDATION_ERROR, INTERNAL_ERROR)
              examples: [NOT_FOUND]
            message:
              type: string
              description: Human-readable message. Internal errors never expose details.
  responses:
    Region:
      description: Region
      content:
        application/json:
          schema:
            type: object
            required: [region, source]
            properties:
              region: { type: string, examples: [PH] }
              source: { $ref: "#/components/schemas/RegionSource" }
    LibraryItem:
      description: Library item
      content:
        application/json:
          schema: { $ref: "#/components/schemas/LibraryItem" }
    Stale:
      description: A newer change is already saved (STALE_WRITE). Refetch, then drop or reapply the queued write.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Throttled:
      description: Progress for this title was saved under 10 s ago (TOO_MANY_WRITES). Retry after Retry-After seconds.
      headers:
        retry-after:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: Error response
      headers:
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
